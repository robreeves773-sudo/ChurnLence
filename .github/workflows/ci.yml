name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Test, type-check & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Verifies the alert system end-to-end without a device, and enforces the
      # alert-only invariant via tests/no-trade-guard.test.ts.
      - name: Test (incl. no-trade guard)
        run: npm test

      # `npm run build` runs `tsc --noEmit` (type-check), the Vite app build, and
      # the standalone background-runner bundle.
      - name: Type-check & build
        run: npm run build
